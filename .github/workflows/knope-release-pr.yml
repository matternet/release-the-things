# Flavour 2, part A: Markdown change files + release PR (knope).
# Runs knope's prepare-release workflow, which opens/updates the
# "chore(knope-demo): release X.Y.Z" PR using knope's built-in CreatePullRequest step.
name: knope release PR

on:
  push:
    branches: [main]
    paths: ["knope-demo/**", ".changeset/**", "knope.toml"]
  workflow_dispatch:

concurrency:
  group: knope-release-pr
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    # Skip the push that is the release merge (squash or merge commit).
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(knope-demo): release') && !contains(github.event.head_commit.message, 'release/knope-demo') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Get release-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Something to release = a change file, or a feat/fix/breaking commit
      # scoped to knope-demo since the last knope-demo/v* tag.
      - name: Anything to release?
        id: check
        run: |
          last="$(git describe --tags --match 'knope-demo/v*' --abbrev=0 2>/dev/null || true)"
          range="${last:+$last..}HEAD"
          if ls .changeset/*.md >/dev/null 2>&1 \
             || git log --format=%s "$range" | grep -qE '^(feat|fix)\(knope-demo\)!?: |^[a-z]+\(knope-demo\)!: '; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release."
          fi

      # Prebuilt single binary: no Rust build, no Node.
      - uses: cargo-bins/cargo-binstall@main
        if: steps.check.outputs.has_changes == 'true'
      - name: Install knope
        if: steps.check.outputs.has_changes == 'true'
        run: cargo binstall -y knope

      - name: Prepare release and open/update the release PR
        if: steps.check.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          knope prepare-release --verbose
