# Flavour 2, part A: intent files + release PR (changie).
# Keeps one "release(changie-demo): vX.Y.Z" PR up to date.
name: changie release PR

on:
  push:
    branches: [main]
    paths: ["changie-demo/**"]
  workflow_dispatch:

concurrency:
  group: changie-release-pr
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    # Skip the push that *is* the release merge.
    # Squash merges start with "release(changie-demo): v"; merge commits mention the branch.
    if: "${{ !startsWith(github.event.head_commit.message, 'release(changie-demo): v') && !contains(github.event.head_commit.message, 'release/changie-demo') }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: changie-demo
    steps:
      - name: Get release-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install changie (single Go binary)
        run: |
          go install github.com/miniscruff/changie@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Any unreleased changes?
        id: check
        run: |
          if ls .changes/unreleased/*.yaml >/dev/null 2>&1; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release."
          fi

      - name: Batch, rebuild changelog, stamp version.h
        id: release
        if: steps.check.outputs.has_changes == 'true'
        run: |
          changie batch auto
          changie merge
          V="$(changie latest)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          printf '#pragma once\n#define FIRMWARE_VERSION "%s"\n' "${V#v}" > include/version.h

      # Recreates the branch from main each run, so late changes are included.
      - name: Open or update the release PR
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: release/changie-demo
          title: "release(changie-demo): ${{ steps.release.outputs.version }}"
          commit-message: "release(changie-demo): ${{ steps.release.outputs.version }}"
          labels: release
          body: |
            Merging this PR ships **changie-demo ${{ steps.release.outputs.version }}**.
            Review `changie-demo/CHANGELOG.md` and `changie-demo/include/version.h`, then squash-merge when ready.
