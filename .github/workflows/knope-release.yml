# Flavour 2, part B: when the knope release PR is merged,
# tag knope-demo/vX.Y.Z and publish a GitHub release (knope's Release step).
name: knope release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/knope-demo'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knope-demo
    steps:
      - name: Get release-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: cargo-bins/cargo-binstall@main
      - name: Install knope
        run: cargo binstall -y knope

      - name: Tag and publish GitHub release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: knope release --verbose
