# Lint demo. Rules:
#  1. A Conventional Commit must name its folder as scope:
#     feat(release-please-demo): ...  /  fix(knope-demo): ...
#     (knope counts unscoped commits for every package, so scopes keep the demos apart)
#  2. Commits touching release-please-demo/ must be Conventional Commits (checked by cog).
#  3. PRs touching knope-demo/ need a release note: a .changeset/*.md file OR a
#     feat/fix commit scoped to knope-demo. Escape hatch: the skip-changelog label.
# We keep merge commits, so every commit lands on main and every commit is checked.
name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    # Release PRs are written by the bots; skip them.
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      github.event.pull_request.head.ref != 'release/knope-demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # cargo-binstall downloads cog's prebuilt binary: no Rust build, no Node.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cocogitto
        run: cargo binstall -y cocogitto
      - name: Check every commit in this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # cog verify needs a git identity, even though it creates no commit.
          git config --global user.name "lint-bot"
          git config --global user.email "lint-bot@users.noreply.github.com"
          fail=0
          err() { echo "::error::$1"; fail=1; }
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject="$(git log -1 --format=%s "$sha")"
            short="$(git log -1 --format=%h "$sha")"
            files="$(git diff-tree --no-commit-id --name-only -r "$sha")"
            echo "== $short $subject"
            scope="$(echo "$subject" | sed -nE 's/^[a-z]+\(([^)]*)\)!?: .*/\1/p')"
            if git log -1 --format=%B "$sha" | cog verify --file - >/dev/null 2>&1; then
              conventional=yes
            else
              conventional=no
            fi
            if echo "$files" | grep -q '^release-please-demo/'; then
              [ "$conventional" = yes ] || err "$short is not a Conventional Commit: $subject"
              [ "$conventional" = no ] || [ "$scope" = release-please-demo ] || err "$short needs scope (release-please-demo): $subject"
            fi
            if echo "$files" | grep -q '^knope-demo/' && [ "$conventional" = yes ] && [ "$scope" != knope-demo ]; then
              err "$short touches knope-demo/; use scope (knope-demo): $subject"
            fi
            if [ "$conventional" = yes ] && [ -z "$scope" ]; then
              err "$short has no scope; knope would count it for every package: $subject"
            fi
          done
          exit $fail

  knope-release-note:
    if: >-
      github.event.pull_request.head.ref != 'release/knope-demo' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Change file or scoped commit?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "$BASE...$HEAD")"
          if ! echo "$files" | grep -q '^knope-demo/'; then
            echo "PR doesn't touch knope-demo/. Nothing to check."; exit 0
          fi
          if echo "$files" | grep -E '^knope-demo/\.changeset/.+\.md$' | grep -qv '/README\.md$'; then
            echo "Change file found."; exit 0
          fi
          if git log --no-merges --format=%s "$BASE..$HEAD" | grep -qE '^(feat|fix)\(knope-demo\)!?: |^[a-z]+\(knope-demo\)!: '; then
            echo "Scoped commit found."; exit 0
          fi
          echo "::error::knope-demo/ changed without a release note. Add .changeset/*.md (or run 'knope document-change'), or commit as fix(knope-demo): / feat(knope-demo):, or add the skip-changelog label."
          exit 1
