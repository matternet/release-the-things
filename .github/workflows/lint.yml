# Lint demo: two single-binary-friendly checks, each scoped to its own flavour.
#  - release-please-demo/: every commit touching it must be a Conventional Commit (checked by cog)
#  - knope-demo/: the PR must add a Markdown change file (or carry the skip-changelog label)
name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      rp: ${{ steps.files.outputs.rp }}
      knope: ${{ steps.files.outputs.knope }}
      knope_file: ${{ steps.files.outputs.knope_file }}
    steps:
      - name: Which demo folders does this PR touch?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "rp=$(has '^release-please-demo/')" >> "$GITHUB_OUTPUT"
          echo "knope=$(has '^knope-demo/')" >> "$GITHUB_OUTPUT"
          echo "knope_file=$(echo "$files" | grep -E '^knope-demo/\.changeset/.+\.md$' | grep -qv '/README\.md$' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # We keep merge commits, so every commit lands on main: lint each one
  # in this PR that touches release-please-demo/.
  commits:
    needs: scope
    if: needs.scope.outputs.rp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # cargo-binstall downloads cog's prebuilt binary: no Rust build, no Node.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cocogitto
        run: cargo binstall -y cocogitto
      - name: cog verify every commit in this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD" -- release-please-demo/); do
            echo "== $(git log -1 --format='%h %s' "$sha")"
            if ! git log -1 --format=%B "$sha" | cog verify --file -; then
              echo "::error::$(git log -1 --format=%h "$sha") is not a Conventional Commit: $(git log -1 --format=%s "$sha")"
              fail=1
            fi
          done
          exit $fail

  change-file:
    needs: scope
    if: >-
      needs.scope.outputs.knope == 'true' &&
      github.event.pull_request.head.ref != 'release/knope-demo' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - name: Did this PR add a change file?
        run: |
          if [ "${{ needs.scope.outputs.knope_file }}" != "true" ]; then
            echo "::error::knope-demo/ changed but no change file was added. Add a .md file to knope-demo/.changeset/ (or run 'knope document-change'), or add the skip-changelog label."
            exit 1
          fi
          echo "Change file found."
