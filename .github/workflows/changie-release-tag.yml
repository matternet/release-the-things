# Flavour 2, part B: when the changie release PR is merged,
# tag changie-demo-vX.Y.Z and publish a GitHub release.
name: changie release tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/changie-demo'
    runs-on: ubuntu-latest
    steps:
      - name: Get release-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install changie
        run: |
          go install github.com/miniscruff/changie@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tag and publish GitHub release
        working-directory: changie-demo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          V="$(changie latest)"
          gh release create "changie-demo-$V" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "changie-demo $V" \
            --notes-file ".changes/$V.md"
