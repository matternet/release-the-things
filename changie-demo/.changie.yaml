# Changie config: every PR adds one small change file to .changes/unreleased/
# Run `changie new` (or copy an existing file) to create one.
changesDir: .changes
unreleasedDir: unreleased
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body}}'
newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1

# `auto` tells `changie batch auto` how big the next version bump is.
# The biggest kind in the batch wins.
kinds:
  - label: Breaking
    auto: major
  - label: Added
    auto: minor
  - label: Changed
    auto: minor
  - label: Fixed
    auto: patch
  - label: Safety
    auto: patch
