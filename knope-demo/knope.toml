# knope config for the knope-demo flavour (run knope from inside knope-demo/).
# Two ways to describe a change, both feed the version bump and the changelog:
#  - Markdown change files: knope-demo/.changeset/*.md
#  - Conventional Commits scoped to this folder: fix(knope-demo): ..., feat(knope-demo): ...
# Unscoped commits would count for every package, so the lint requires a scope.

[packages.knope-demo]
versioned_files = [
  { path = "include/version.h", regex = 'FIRMWARE_VERSION "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"
scopes = ["knope-demo"]

[github]
owner = "matternet"
repo = "release-the-things"

# Workflow A: build the release on a branch and open/update the release PR.
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release/knope-demo"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore(knope-demo): release $version\" && git push --force --set-upstream origin release/knope-demo"
shell = true

[workflows.steps.variables]
"$version" = "Version"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore(knope-demo): release $version"
variables = { "$version" = "Version" }

[workflows.steps.body]
template = "Merging this PR ships knope-demo $version.\n\n$changelog"
variables = { "$version" = "Version", "$changelog" = "ChangelogEntry" }

# Workflow B: after the release PR is merged, tag knope-demo/vX.Y.Z and publish a GitHub release.
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

# Local helper: `knope document-change` asks a few questions and writes a change file.
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
